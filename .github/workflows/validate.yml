name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验技能结构（Agent Skills 规范）
        run: python scripts/validate_skill.py .

      - name: 交付自检（critical/high 应为零）
        run: python scripts/preflight.py --all --strict

      - name: 脚本冒烟测试（stdlib unittest）
        run: python -m unittest discover -s tests -v

      - name: 交付闸门（技能仓库自身按 L1 过闸）
        run: python scripts/ship_check.py --level L1 --timeout 300

      # 性能护栏：预算故意放得宽（约 4× 余量），它拦的是"数量级回退"，
      # 不是"慢了两成"。真正锁死成本的是 tests/test_scripts.py 里的
      # TestAuditCostModel（结构量：干净仓库图层解析 0 个文件、
      # 仓库×4 而候选不变时解析数不变）——那个不受机器快慢影响。
      - name: 审计链性能护栏（预算内完成，拦数量级回退）
        run: python evals/audit-fixtures/bench.py --workdir "$RUNNER_TEMP/audit-bench" --files 400 --repeat 1 --max-ms-per-file 20 --max-mb 128

      - name: 审计链靶场复跑（检出率与误报率不许滑坡）
        run: |
          python evals/audit-fixtures/gen_corpus.py --out "$RUNNER_TEMP/audit-bench-corpus"
          python evals/audit-fixtures/score.py --corpus "$RUNNER_TEMP/audit-bench-corpus"
