name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验技能结构（Agent Skills 规范）
        run: python scripts/validate_skill.py .

      - name: 交付自检（critical/high 应为零）
        run: python scripts/preflight.py --all --strict

      - name: 脚本冒烟测试（stdlib unittest）
        run: python -m unittest discover -s tests -v
